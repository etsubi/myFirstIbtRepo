<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Habesha Eatery | Reservations</title>
    <meta name="description" content="Reserve a table at Habesha Eatery." />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Habesha Eatery</h1>
      <nav>
        <a href="index.html">Home</a>
        <a href="index.html#menu">Menu</a>
        <a href="contact.html">Reservations</a>
        <a href="index.html#visit">Visit</a>
      </nav>
    </header>
    <main>
      <section id="reservation">
        <h2>Reserve a Table</h2>
        <form>
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required />

          <label for="email">Email</label>
          <input type="email" id="email" name="email" required />

          <label for="phone">Telephone</label>
          <input type="tel" id="phone" name="phone" required />

          <label for="date">Reservation Date</label>
          <input type="date" id="date" name="date" required />

          <label for="party-size">Party Size</label>
          <input
            type="number"
            id="party-size"
            name="party-size"
            min="1"
            required
          />
          <label for="special-requests">Special Requests</label>
          <textarea
            id="special-requests"
            name="special-requests"
            rows="4"
          ></textarea>
          <button type="submit">Reserve Table</button>
        </form>
      </section>
    </main>
    <footer><p>&copy; 2026 Habesha Eatery. All rights reserved.</p></footer>
  </body>
</html>
