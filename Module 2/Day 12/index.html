<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Habesha Eatery Reservation</title>
  </head>
  <body>
    <header>
      <h1>Habesha Eatery</h1>
      <nav>
        <a href="#">Home</a>
        <a href="#">Menu</a>
        <a href="#">Reservations</a>
        <a href="#">Contact</a>
      </nav>
    </header>
    <section>
      <h2>Reserve a Table</h2>
      <form>
        <label for="name">Full Name</label>
        <input type="text" name="name" required />
        <label for="email">Email</label>
        <input type="email" name="email" required />
        <label for="phone">Phone Number</label>
        <input type="tel" name="phone" required />
        <label for="date"> Reservation Date </label>
        <input type="date" id="date" name="date" required />
        <label for="party"> Party Size </label>
        <input type="number" id="party" name="party" min="1" required />
        <label for="requests"> Special Requests </label>
        <textarea name="requests" rows="4"></textarea>
        <button>Reserve</button>
      </form>
    </section>
    <section>
      <h2>Menu</h2>
      <table>
        <caption>
          Popular Dishes
        </caption>
        <tr>
          <th scope="col">Dish</th>
          <th scope="col">Description</th>
          <th scope="col">Price (ETB)</th>
        </tr>
      </table>
    </section>
    <section>
      <h2>Visit Us</h2>
      <img
        src="images/shiro.jpg"
        alt="A traditional Ethiopian dish called Shiro, made from ground chickpeas and spices."
      />
    </section>
    <footer>
      <p>© 2026 Habesha Eatery</p>
    </footer>
  </body>
</html>
