<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS Currency Converter</title>
  </head>
  <body>
    <main>
      <h1>Birr Watch</h1>
      <p id="status">Loading rates....</p>
      <form id="convert-form">
        <label for="amount">Amount in ETB</label>

        <input id="amount" type="number" value="100" />

        <label for="currency">Currency</label>

        <select id="currency"></select>

        <button type="submit">Convert</button>
        <button type="button" id="watch">Add to Watchlist</button>
      </form>
      <p id="result"></p>
      <h2>Watchlist</h2>
      <ul id="watchlist"></ul>
    </main>
    <script src="app.js"></script>
  </body>
</html>
